name: Acquire real administrative boundaries
on:
  push:
    paths: ['.github/workflows/acquire-real-boundaries.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download full resolution boundaries and metadata
        run: |
          mkdir -p real-boundaries
          python - <<'PY'
          import urllib.request,json,pathlib,hashlib
          root=pathlib.Path('real-boundaries')
          for iso,level in [('CHN','ADM3'),('MNG','ADM2'),('PRK','ADM2')]:
              api=f'https://www.geoboundaries.org/api/current/gbOpen/{iso}/{level}/'
              raw=urllib.request.urlopen(api,timeout=90).read()
              meta=json.loads(raw);(root/f'{iso}_{level}_metadata.json').write_bytes(raw)
              url=meta['gjDownloadURL']
              data=urllib.request.urlopen(url,timeout=180).read()
              if data.startswith(b'version https://git-lfs'):
                  url=url.replace('https://github.com/','https://media.githubusercontent.com/media/').replace('/raw/','/')
                  data=urllib.request.urlopen(url,timeout=180).read()
              obj=json.loads(data)
              assert obj['type']=='FeatureCollection'
              (root/f'{iso}_{level}.json').write_bytes(data)
              print(iso,level,len(obj['features']),len(data),hashlib.sha256(data).hexdigest(),flush=True)
              print(json.dumps(obj['features'][0]['properties'],ensure_ascii=False),flush=True)
          (root/'SHA256.json').write_text(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.glob('*.json')},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: real-boundary-source-snapshots
          path: real-boundaries/
          retention-days: 30
          compression-level: 6
