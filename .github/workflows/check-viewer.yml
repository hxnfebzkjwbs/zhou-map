name: Validate web atlas
on:
  push:
    paths:
      - 'index.html'
      - 'web/**'
      - 'data/counties.json'
      - 'data/connections.json'
      - 'scripts/build_viewer.py'
      - 'tests/web*'
      - '.github/workflows/check-viewer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate JSON semantics and shortest paths
        run: node --test tests/web-model.test.cjs
      - name: Build JSON-only static distribution and offline HTML
        run: python scripts/build_viewer.py --output dist
      - name: Install test browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Exercise desktop and mobile interfaces against real JSON
        run: python tests/web_ui_test.py
      - name: Retain tested viewer and evidence
        uses: actions/upload-artifact@v4
        with:
          name: zhou-atlas-web
          path: |
            dist/
            test-results/
          include-hidden-files: true
          retention-days: 30
