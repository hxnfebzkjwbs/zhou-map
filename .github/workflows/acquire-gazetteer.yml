name: Acquire modern gazetteer
on:
  push:
    paths:
      - '.github/workflows/acquire-gazetteer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download public GeoNames source snapshots
        shell: bash
        run: |
          mkdir -p gazetteer
          for cc in CN KP MN; do
            curl --fail --location --retry 3 --max-time 180 "https://download.geonames.org/export/dump/${cc}.zip" -o "gazetteer/${cc}.zip"
          done
          curl --fail --location --retry 3 https://download.geonames.org/export/dump/readme.txt -o gazetteer/readme.txt
          cd gazetteer
          sha256sum *.zip > SHA256SUMS
          printf '%s\n' 'GeoNames geographical database, https://www.geonames.org/' 'CC BY 4.0, https://creativecommons.org/licenses/by/4.0/' 'Modern place-name source only; not ancient boundaries, population, or sovereignty.' > ATTRIBUTION.txt
      - name: Retain source snapshots for this data build
        uses: actions/upload-artifact@v4
        with:
          name: geonames-source-snapshots
          path: gazetteer/
          compression-level: 0
          retention-days: 7
